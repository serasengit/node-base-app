stages:
  - dependencies # First stage: install project dependencies.
  - build # Second stage: build the TypeScript project.
  - test # Third stage: run tests and validate coverage.
  - sonar # Fourth stage: run SonarQube static analysis.
  - zap # Fifth stage: run ZAP security analysis.

# Install project dependencies.
dependencies:
  stage: dependencies
  image: node:20-slim # Use the same Node.js major version as the Dockerfile.
  script:
    - npm ci --include=dev # Install dependencies from package-lock.json, including dev dependencies.
  cache:
    key:
      files:
        - package-lock.json # Rebuild the cache when package-lock.json changes.
    paths:
      - node_modules # Cache node_modules to speed up future pipeline executions.
    policy: pull-push # Restore the cache before the job and update it afterwards.
  artifacts:
    paths:
      - node_modules/ # Make node_modules available to downstream jobs.
    expire_in: 1 hour
  only:
    - merge_requests # Run this job for merge requests.
    - develop # Run this job on the develop branch.
    - main # Run this job on the main branch.

# Build the TypeScript project.
build:
  stage: build
  image: node:20-slim # Use the same Node.js major version as the Dockerfile.
  needs:
    - job: dependencies # Reuse dependencies installed by the dependencies job.
      artifacts: true
  script:
    - npm run build # Compile TypeScript into the dist directory.
  artifacts:
    paths:
      - dist/ # Store the compiled application as a pipeline artifact.
    expire_in: 1 hour
  cache:
    key:
      files:
        - package-lock.json # Use the same dependency cache key as the dependencies job.
    paths:
      - node_modules # Restore node_modules from cache if available.
    policy: pull # Only restore the cache; do not update it from this job.
  only:
    - merge_requests # Run this job for merge requests.
    - develop # Run this job on the develop branch.
    - main # Run this job on the main branch.

# Run tests and validate code coverage.
test:
  stage: test
  image: docker:24.0.5-cli # Use Docker CLI because this job runs the test stack with Docker Compose.

  # Docker-in-Docker service used to build and run the test containers.
  # The GitLab runner must be configured with privileged = true.
  services:
    - name: docker:24.0.5-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375 # Docker daemon exposed by the docker:dind service.
    DOCKER_TLS_CERTDIR: '' # Disable Docker TLS inside the isolated CI network.

  before_script:
    - apk add --no-cache nodejs npm # Install Node.js and npm in the Docker CLI image.
    - npm ci --include=dev # Install project dependencies, including dev dependencies.

  script:
    # Start the unit-tests Compose profile.
    - |
      if ! docker compose --env-file environments/.env.test --profile unit-tests up --build -d; then
        docker compose --env-file environments/.env.test logs migrations
        docker compose --env-file environments/.env.test down --remove-orphans
        exit 1
      fi

    # Get the container ID of the unit-tests service.
    - UNIT_TESTS_CONTAINER=$(docker compose --env-file environments/.env.test ps -q unit-tests)

    # Wait until the unit-tests container finishes.
    - |
      echo "Waiting for unit-tests container ($UNIT_TESTS_CONTAINER) to finish..."
      while [ "$(docker inspect -f '{{.State.Running}}' "$UNIT_TESTS_CONTAINER")" = "true" ]; do
        sleep 2
      done

    # Print unit test logs for troubleshooting and pipeline visibility.
    - docker compose --env-file environments/.env.test logs unit-tests

    # Read the container exit code and fail the job if tests failed.
    - |
      exit_code=$(docker wait "$UNIT_TESTS_CONTAINER")
      echo "Container exit code: $exit_code"
      if [ "$exit_code" -ne 0 ]; then
        echo "Tests failed."
        exit "$exit_code"
      fi

    # Stop and remove containers created by Docker Compose.
    - docker compose --env-file environments/.env.test down --remove-orphans

  artifacts:
    when: always
    paths:
      - coverage/ # Store the coverage report as a pipeline artifact.
    expire_in: 1 week

  cache:
    key:
      files:
        - package-lock.json # Use the same dependency cache key as the dependencies job.
    paths:
      - node_modules # Restore node_modules from cache if available.
    policy: pull # Only restore the cache; do not update it from this job.

  only:
    - merge_requests # Run this job for merge requests.
    - develop # Run this job on the develop branch.
    - main # Run this job on the main branch.

# Run SonarQube static code analysis.
sonar:
  stage: sonar

  # Use the official SonarScanner CLI image so the sonar-scanner command is available.
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: ['']

  needs:
    - job: test # Download artifacts from the test job, especially coverage reports.
      artifacts: true

  allow_failure: true # Do not fail the full pipeline if SonarQube analysis fails.

  variables:
    SONAR_USER_HOME: '${CI_PROJECT_DIR}/.sonar' # Store SonarScanner cache inside the project workspace.
    GIT_DEPTH: '0' # Fetch full Git history so SonarQube can assign blame information.

  script:
    - sonar-scanner # Run SonarScanner using sonar-project.properties and CI variables.

  cache:
    key: sonar-cache # Reuse SonarScanner cache between pipeline executions.
    paths:
      - .sonar/cache

  only:
    - merge_requests # Run SonarQube analysis for merge requests.
    - main # Run SonarQube analysis on the main branch.

# Run ZAP security analysis against the containerized application.
zap:
  stage: zap
  image: docker:24.0.5-cli

  # Docker-in-Docker service used to build and run the application containers.
  # The GitLab runner must be configured with privileged = true.
  services:
    - name: docker:24.0.5-dind
      alias: docker

  variables:
    # Docker daemon exposed by the docker:dind service.
    DOCKER_HOST: tcp://docker:2375

    # Disable Docker TLS inside the isolated CI network.
    DOCKER_TLS_CERTDIR: ''

    # Use a unique Docker Compose project name to avoid collisions between concurrent pipelines.
    COMPOSE_PROJECT_NAME: '${CI_PROJECT_PATH_SLUG}-${CI_PIPELINE_IID}'

    # Runtime environment used by the application stack.
    NODE_ENV: test

  before_script:
    # Create the local directory where ZAP reports will be stored.
    - mkdir -p zap-reports

    # Print Docker versions for troubleshooting.
    - docker version
    - docker compose version

  script:
    # Load environment variables from the test environment file.
    - set -a
    - . environments/.env.test
    - set +a

    # Build the ZAP target URL using the Docker Compose service name and .env.test values.
    # Example: http://app:3001/api/v1
    - export ZAP_TARGET_URL="http://app:${SERVER_PORT}/${SERVER_API}"

    # Build the healthcheck URL executed from inside the app container.
    # Example: http://127.0.0.1:3002/health
    - export HEALTHCHECK_URL="http://127.0.0.1:${HEALTHCHECK_PORT}/health"

    # Print resolved URLs for pipeline visibility.
    - echo "ZAP target URL: ${ZAP_TARGET_URL}"
    - echo "Healthcheck URL: ${HEALTHCHECK_URL}"

    # Start PostgreSQL first.
    - docker compose --env-file environments/.env.test --profile app up --build -d postgres

    # Run database migrations and seeds using the migrations container.
    - docker compose --env-file environments/.env.test --profile migrations run --rm migrations

    # Start the application container.
    - docker compose --env-file environments/.env.test --profile app up --build -d app

    # Wait until the application healthcheck is ready from inside the app container.
    - |
      echo "Waiting for application healthcheck..."
      for i in $(seq 1 60); do
        if docker compose --env-file environments/.env.test exec -T app curl -fsS "${HEALTHCHECK_URL}"; then
          echo "Application is ready."
          break
        fi

        echo "Application is not ready yet. Retry $i/60..."
        sleep 2

        if [ "$i" -eq 60 ]; then
          echo "Application did not become ready in time."
          docker compose --env-file environments/.env.test ps
          docker compose --env-file environments/.env.test logs app
          exit 1
        fi
      done

    # Run ZAP inside the same Docker Compose network so it can reach the app service by name.
    - |
      docker run --rm \
        --network "${COMPOSE_PROJECT_NAME}_default" \
        -v "$CI_PROJECT_DIR/zap-reports:/zap/wrk:rw" \
        zaproxy/zap-stable \
        zap-baseline.py \
          -t "$ZAP_TARGET_URL" \
          -g gen.conf \
          -I \
          -r zap_report.html \
          -x zap_report.xml

  after_script:
    # Print application logs even if the job fails.
    - docker compose --env-file environments/.env.test logs app || true

    # Remove containers, networks and volumes created by Docker Compose.
    - docker compose --env-file environments/.env.test down --remove-orphans --volumes || true

  artifacts:
    # Always upload reports, even if ZAP finds issues or the job fails.
    when: always
    paths:
      - zap-reports/zap_report.html
      - zap-reports/zap_report.xml
    expire_in: 1 week

  # Run ZAP for merge requests and the main development branches.
  only:
    - merge_requests
    - develop
    - main

  needs:
    # Ensure the application builds before starting the containerized ZAP scan.
    - job: build
      artifacts: true
