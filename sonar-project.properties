# Unique key for the project in SonarQube
sonar.projectKey=sddt_technology-templates_node-template_7c1bdec8-8ecf-41c7-b5c1-41795e9f7847

# Display name of the project in SonarQube UI
sonar.projectName=SDDT-TECHNOLOGY-TEMPLATES-node-template

# Current version of the project
sonar.projectVersion=1.0

# Source file encoding (UTF-8 is the default and recommended)
sonar.sourceEncoding=UTF-8

# Path to source files to be analyzed
sonar.sources=app

# Exclude specific paths from analysis (e.g., node_modules folder)
sonar.exclusions=**/node_modules/**

# Path to test files
sonar.tests=app

# Include only these files as test files (based on pattern)
sonar.test.inclusions=**/*.spec.ts

# Path to the code coverage report generated by the test runner
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Exclude non-business utility files from coverage calculations
sonar.coverage.exclusions=app/docs/**

# Block the pipeline until the quality gate status is known
sonar.qualitygate.wait=true
